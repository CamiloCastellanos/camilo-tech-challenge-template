<div class="d-flex layout">
  <nav
    class="sidebar d-flex flex-column flex-shrink-0 position-fixed"
    [class.collapsed]="collapsed"
  >
    <button class="toggle-btn" (click)="toggleSidebar()">
      <fa-icon icon="chevron-left"></fa-icon>
    </button>

    <div class="p-4">
      <h4 class="logo-text fw-bold mb-0">App</h4>
      <p class="text-white small hide-on-collapse">By Camilo Castellanos</p>
    </div>

    <div class="nav flex-column">
      @for (item of menu; track $index) {
        <a
          class="sidebar-link text-decoration-none p-3"
          routerLinkActive="active"
          [routerLink]="item.page"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <fa-icon [icon]="item.icon"></fa-icon>
          <span class="hide-on-collapse">{{ item.text }}</span>
        </a>
      }
    </div>

    <div class="profile-section mt-auto p-4">
      @if (user.image != null && user.image != '') {
        <div class="d-flex align-items-center justify-content-center mb-2">
          <img [src]="user.image" style="height: 60px" class="rounded-circle" alt="Profile" />
        </div>
      }
      <div class="d-flex align-items-center justify-content-center text-center">
        <div class="ms-3 profile-info">
          <h6 class="text-white mb-0">{{ user.email }}</h6>
          <small class="text-white">{{ userType }}</small>
        </div>
      </div>
      <div class="logOut d-flex align-items-center justify-content-center">
        <button
          class="btn text-white d-flex align-items-center justify-content-center"
          (click)="logOut()"
        >
          <fa-icon icon="arrow-right-from-bracket"></fa-icon>
          <h6 class="text-white mb-0 mx-2">log out</h6>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container-fluid">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
