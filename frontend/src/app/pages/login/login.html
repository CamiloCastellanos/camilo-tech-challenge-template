<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card" style="border-radius: 1rem">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
              <img
                src="img/login.svg"
                alt="login form"
                class="img-fluid"
                style="border-radius: 1rem 0 0 1rem"
              />
            </div>
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">
                <form [formGroup]="loginForm" (ngSubmit)="login()">
                  <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px">
                    Sign into your account
                  </h5>
                  @if (showAlert) {
                    <ngb-alert type="danger" (closed)="closeAlert()">
                      Incorrect email address or password
                    </ngb-alert>
                  }

                  <div class="form-outline mb-4">
                    <div class="has-validation">
                      <input
                        type="email"
                        id="email"
                        class="form-control form-control-lg"
                        formControlName="email"
                        placeholder="Email address"
                        [class.is-invalid]="
                          loginForm.get('email')?.touched && loginForm.get('email')?.invalid
                        "
                        [class.is-valid]="loginForm.get('email')?.valid"
                      />
                      @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
                        <label class="invalid-feedback">Please enter your email address</label>
                      }
                    </div>
                  </div>
                  <div class="form-outline mb-4">
                    <input
                      type="password"
                      id="password"
                      class="form-control form-control-lg"
                      formControlName="password"
                      placeholder="Password"
                      [class.is-invalid]="
                        loginForm.get('password')?.touched && loginForm.get('password')?.invalid
                      "
                    />
                    @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
                      <label class="invalid-feedback">Please enter your Password</label>
                    }
                  </div>

                  <div class="pt-1 mb-4">
                    <button class="btn btn-dark btn-lg btn-block" type="submit">Login</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
