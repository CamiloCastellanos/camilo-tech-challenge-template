<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card" style="border-radius: 1rem">
          <div class="card-header d-flex align-items-end justify-content-end">
            <add-user (refreshUserListEvent)="getAllUsers()"></add-user>
          </div>
          <div class="row g-0">
            <div class="col d-flex align-items-center">
              <div class="card-body px-5 py-0">
                <table class="table align-middle mb-0 bg-white">
                  <thead class="bg-light">
                    <tr>
                      <th>Name</th>
                      <th>Email</th>
                      <th>User Type</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    @for (user of userList; track $index) {
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <img
                              [src]="user.image"
                              alt="User Image"
                              style="width: 45px; height: 45px"
                              class="rounded-circle"
                            />
                            <div class="ms-3">
                              <p class="fw-bold mb-1">{{ user.name }}</p>
                            </div>
                          </div>
                        </td>
                        <td>
                          <p class="text-muted mb-0">{{ user.email }}</p>
                        </td>
                        <td>
                          <p class="text-muted mb-0">{{ getUserType(user.userType) }}</p>
                        </td>
                        <td>
                          <button
                            type="button"
                            class="btn btn-sm btn-rounded"
                            (click)="deleteUser(user, $index)"
                          >
                            <fa-icon [icon]="faTrash" style="color: #c73434f0"></fa-icon>
                          </button>
                        </td>
                      </tr>
                    }
                  </tbody>
                </table>
                <div class="row d-flex justify-content-between p-2">
                  <div class="col-10 d-flex justify-content-end align-items-center">
                    <ngb-pagination
                      [collectionSize]="collectionSize"
                      [(page)]="page"
                      [pageSize]="pageSize"
                      (pageChange)="refreshData()"
                    >
                    </ngb-pagination>
                  </div>
                  <div class="col">
                    <select
                      class="form-select"
                      [(ngModel)]="pageSize"
                      (ngModelChange)="refreshData()"
                    >
                      <option [ngValue]="5">5 items per page</option>
                      <option [ngValue]="10">10 items per page</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
